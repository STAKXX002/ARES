[package]
name = "ares"
version = "0.0.1"
edition = "2021"
description = "Autonomous Runtime and Environment Supervisor"
license = "MIT"
repository = "https://github.com/STAKXX002/A.R.E.S."
readme = "README.md"

[dependencies]
# Bundled SQLite: compiled from source, so no system libsqlite3 is needed.
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
